[project]
name = "puck"
version = "0.1.0"
description = "Open-source programmable space from the University of St Andrews."
readme = "README.md"
authors = [
    { name = "Julia Dreiling", email = "jmcd1@st-andrews.ac.uk" },
    { name = "David Morrison", email = "dm236@st-andrews.ac.uk" },
    { name = "Michael Young", email = "mct25@st-andrews.ac.uk" },
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
puck = "puck.__main__:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
