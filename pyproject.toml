[project]
name = "puck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "click>=8.1.8",
    "dotenv>=0.9.9",
    "ipykernel>=6.31.0",
    "ipython>=8.18.1",
    "matplotlib>=3.9.4",
    "matplotlib-inline>=0.2.1",
    "numpy>=2.3",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "pillow>=12.0.0",
    "plotly>=6.7.0",
    "psutil>=7.1.3",
    "pyx>=0.17",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "tex>=1.8",
    "tqdm>=4.67.1",
    "nbformat>=4.2.0",
    "pyglet>=2.1.14",
]

[project.scripts]
puck = "puck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
